---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>
    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" href="{{ base_path }}/">{{ site.title }}</a>

        <nav class="site-nav">
          <input type="checkbox" id="nav-trigger" class="nav-trigger" />
          <label for="nav-trigger">
            <span class="menu-icon">
              <svg viewBox="0 0 18 15" width="18px" height="15px" aria-hidden="true">
                <rect width="18" height="2" y="0" fill="#424242" />
                <rect width="18" height="2" y="6.5" fill="#424242" />
                <rect width="18" height="2" y="13" fill="#424242" />
              </svg>
            </span>
          </label>

          <div class="trigger">
            {% for link in site.data.navigation.main %}
              <a class="page-link" href="{{ base_path }}{{ link.url }}">{{ link.title }}</a>
            {% endfor %}
          </div>
        </nav>
      </div>
    </header>

    <main class="page-content" role="main">
      <div class="wrapper">
        <h1 class="visually-hidden">{{ page.title }}</h1>
        <div class="post-content">
          {{ content }}
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <ul class="social-links">
          <li><a href="https://github.com/{{ site.author.github }}">GitHub</a></li>
          <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}">LinkedIn</a></li>
          <li><a href="{{ site.author.googlescholar }}">Google Scholar</a></li>
        </ul>
      </div>
    </footer>

    {% include analytics.html %}
  </body>
</html>
